<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Ethiopia House Rental</title>
</head>
<body>
    <header>
        <h1>Ethiopia House Rental</h1>
        <nav>
            <a href="index.html">Home</a> |
            <a href="register.html">Register</a>
        </nav>
    </header>

    <hr>

    <main>
        <h2>Sign In</h2>
        <p>Enter your phone number or email address and password.</p>

        <form method="post">
            <p>
                <label>
                    Phone number or email:
                    <input type="text" name="user" required
                           placeholder="+251911223344 or name@example.com">
                </label>
            </p>

            <p>
                <label>
                    Password:
                    <input type="password" name="password" required>
                </label>
            </p>

            <p><button type="submit">Sign In</button></p>
        </form>

        <p>
            Don't have an account?
            <a href="register.html">Create an account</a>.
        </p>
        <p><a href="forget-password.html">Forgot your password?</a></p>
    </main>

    <hr>

    <footer>
        <p>
            &copy; 2026 Ethiopia House Rental |
            <a href="contact-us.html">Contact Us</a> |
            <a href="term-use.html">Terms of Use</a>
        </p>
    </footer>
</body>
</html>
