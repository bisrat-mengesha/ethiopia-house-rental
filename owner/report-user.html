<h2>Report User</h2>

<form action="#" method="post">
  <p>
    <label for="tenant">Select user:</label><br>
    <select id="tenant" name="tenant" required>
      <option value="">Choose a tenant</option>
      <option value="dawit">Dawit Alemu</option>
      <option value="hana">Hana Girma</option>
    </select>
  </p>
  <p>
    <label for="reason">Reason:</label><br>
    <select id="reason" name="reason" required>
      <option value="late-payment">Late payment</option>
      <option value="damage">Property damage</option>
      <option value="other">Other</option>
    </select>
  </p>
  <p>
    <label for="details">Description:</label><br>
    <textarea id="details" name="details" rows="5" cols="40" required></textarea>
  </p>
  <p>
    <button type="submit">Submit report</button>
  </p>
</form>
